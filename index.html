<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>نضال الخطيب | بطاقة تواصل</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(145deg,#111827,#1f2937 55%,#374151);
  color:#fff; display:flex; justify-content:center; align-items:center;
  padding:22px;
}
.card{
  width:100%; max-width:430px; padding:30px 22px 24px;
  border:1px solid rgba(255,255,255,.12); border-radius:28px;
  background:rgba(255,255,255,.09); backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(0,0,0,.35); text-align:center;
}
.avatar{
  width:100px;height:100px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff,#d1d5db); color:#111827;
  font-size:34px;font-weight:800;border:4px solid rgba(255,255,255,.25);
}
h1{margin:0;font-size:29px}
.subtitle{margin:8px 0 25px;color:#d1d5db;font-size:14px}
.buttons{display:grid;gap:12px}
a{
  text-decoration:none;color:#fff;padding:16px 18px;border-radius:16px;
  font-size:17px;font-weight:700;display:flex;align-items:center;
  justify-content:center;gap:10px;transition:.2s;
}
a:active{transform:scale(.98)}
.phone{background:#16a34a}.wa{background:#128c7e}.fb{background:#1877f2}
.contact{background:#374151;border:1px solid rgba(255,255,255,.12)}
.icon{font-size:22px}
.footer{margin-top:22px;color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="avatar">ن</div>
  <h1>نضال الخطيب</h1>
  <div class="subtitle">بطاقة التواصل الرقمية</div>

  <div class="buttons">
    <a class="phone" href="tel:+962798850656">
      <span class="icon">📞</span> اتصال مباشر
    </a>

    <a class="wa" href="https://wa.me/962798850656" target="_blank" rel="noopener">
      <span class="icon">💬</span> واتساب
    </a>

    <a class="fb" href="https://www.facebook.com/share/1C8JGvnRpB/" target="_blank" rel="noopener">
      <span class="icon">📘</span> فيسبوك
    </a>

    <a class="contact" href="tel:+962798850656">
      <span class="icon">➕</span> حفظ الرقم / إضافة لجهات الاتصال
    </a>
  </div>

  <div class="footer">امسح بطاقة NFC لفتح بطاقة التواصل</div>
</main>
</body>
</html>
